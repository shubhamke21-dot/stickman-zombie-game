  <title>Stickman Zombie Kingdom</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #050b1a;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #game {
      display: block;
      margin: 0 auto;
      background: linear-gradient(#79d6ff, #dff7ff 55%, #8ae7a0 100%);
      border: 4px solid #111827;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }
    .hud {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hud div {
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(17,24,39,0.75);
      border-radius: 10px;
      padding: 8px 12px;
      color: #111827;
      font-weight: bold;
      min-width: 120px;
      text-align: center;
      backdrop-filter: blur(2px);
    }
    .menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #050b1a 0%, #1a2a4a 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .menu.hidden { display: none; }
    .menu-container {
      text-align: center;
    }
    .menu h1 {
      font-size: 60px;
      margin: 0 0 20px 0;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
    }
    .menu p {
      font-size: 18px;
      margin: 10px 0;
      color: #cbd5e1;
    }
    .menu-buttons {
      margin-top: 40px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .menu-btn {
      padding: 15px 40px;
      font-size: 20px;
      border: 3px solid #60a5fa;
      background: rgba(96, 165, 250, 0.2);
      color: #60a5fa;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.3s;
    }
    .menu-btn:hover {
      background: rgba(96, 165, 250, 0.5);
      transform: scale(1.05);
    }
    .inventory-panel {
      position: fixed;
      right: 20px;
      top: 80px;
      background: rgba(0,0,0,0.85);
      border: 3px solid #60a5fa;
      border-radius: 10px;
      padding: 15px;
      max-width: 250px;
      z-index: 5;
      color: #f8fafc;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }
    .inventory-panel.show { display: block; }
    .inventory-item {
      padding: 8px;
      margin: 5px 0;
      background: rgba(96, 165, 250, 0.2);
      border: 1px solid #60a5fa;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    .inventory-item:hover {
      background: rgba(96, 165, 250, 0.4);
    }
    .inventory-item.active {
      background: rgba(34, 197, 94, 0.3);
      border-color: #22c55e;
    }
  </style>
</head>

    let currentLevelIndex = 0;
    let level = null;
    let gameWon = false;
    let gameOver = false;
    let levelComplete = false;

      left: false,
      right: false,
      jump: false,
      attack: false

    const player = {
      x: 90,
      y: 200,
      w: 28,
      h: 62,
      vx: 0,
      vy: 0,
      speed: 4.3,
      jumpPower: 13.5,
      onGround: false,
      canDoubleJump: true,
      hasDoubleJump: true,
      facing: 1,
      health: 100,
      maxHealth: 100,
      score: 0,
      attackCooldown: 0,
      invuln: 0,
      weaponIndex: 0,
      weapon: null,
      keyJumpPressed: false

    const camera = { x: 0 };

    function cloneLevel(levelDef) {
      return JSON.parse(JSON.stringify(levelDef));
    }

    function loadLevel(index) {
      currentLevelIndex = index;
      level = cloneLevel(levels[index]);
      player.x = level.spawn.x;
      player.y = level.spawn.y;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.canDoubleJump = true;
      player.weaponIndex = Math.min(player.weaponIndex, weaponCatalog.length - 1);
      player.weapon = weaponCatalog[player.weaponIndex];
      camera.x = 0;
      player.health = player.maxHealth;
      levelComplete = false;
      updateHud();
      populateInventory();
    }

    function populateInventory() {
      const weaponList = document.getElementById('weaponList');
      weaponList.innerHTML = '';
      for (let i = 0; i < Math.min(15, weaponCatalog.length); i++) {
        const weapon = weaponCatalog[i];
        const div = document.createElement('div');
        div.className = 'inventory-item' + (i === player.weaponIndex ? ' active' : '');
        div.textContent = `${weapon.name} (DMG: ${weapon.damage})`;
        div.onclick = () => setWeapon(i);
        weaponList.appendChild(div);
      }
    }

    function updateHud() {
      if (!player.weapon) return;
      levelEl.textContent = `Level: ${currentLevelIndex + 1}`;
      healthEl.textContent = `Health: ${Math.max(0, Math.ceil(player.health))}`;
      scoreEl.textContent = `Score: ${player.score}`;
      weaponEl.textContent = `Weapon: ${player.weapon.name}`;
      skillEl.textContent = `Skill: ${player.weapon.skill}`;
    }

    function setWeapon(index) {
      if (index >= weaponCatalog.length) index = 0;
      player.weaponIndex = index;
      player.weapon = weaponCatalog[index];
      populateInventory();
      updateHud();
    }

    function nextWeapon() {
      setWeapon((player.weaponIndex + 1) % weaponCatalog.length);
    }

    function prevWeapon() {
      setWeapon((player.weaponIndex - 1 + weaponCatalog.length) % weaponCatalog.length);
    }

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

    function circleRectCollision(circle, rect) {
      const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
      const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
      const dx = circle.x - closestX;
      const dy = circle.y - closestY;
      return dx * dx + dy * dy <= circle.r * circle.r;
    }

    function handleInput() {
      player.vx = 0;
      if (keys.left) player.vx = -player.speed;
      if (keys.right) player.vx = player.speed;

      if (keys.left) player.facing = -1;
      if (keys.right) player.facing = 1;

      if (keys.jump && player.onGround && !player.keyJumpPressed) {
        player.vy = -player.jumpPower;
        player.onGround = false;
        player.canDoubleJump = true;
        player.keyJumpPressed = true;
      } else if (keys.jump && !player.onGround && player.canDoubleJump && player.hasDoubleJump && !player.keyJumpPressed) {
        player.vy = -player.jumpPower * 0.9;
        player.canDoubleJump = false;
      }

      if (!keys.jump) {
        player.keyJumpPressed = false;
      }

      if (keys.attack && player.attackCooldown <= 0) {
        performAttack();
        player.attackCooldown = 0.32;
      }
    }

    function performAttack() {
      const hitbox = {
        x: player.x + (player.facing > 0 ? player.w : -42),
        y: player.y + 6,
        w: 42,
        h: 30
      };

      let damage = player.weapon.damage;
      const skill = player.weapon.skill;

      if (skill.includes("Smash") || skill.includes("Crash") || skill.includes("Slam")) {
        damage *= 1.4;
        player.vy = Math.min(player.vy, 0);
      }
      if (skill.includes("Leap") || skill.includes("Rush") || skill.includes("Dive")) {
        player.x += player.facing * 18;
      }
      if (skill.includes("Burst") || skill.includes("Arc") || skill.includes("Wave")) {
        damage *= 1.2;
      }
      if (skill.includes("Sweep")) {
        hitbox.w = 60;
      }

      for (const enemy of level.enemies) {
        if (!enemy.alive) continue;
        const eRect = { x: enemy.x, y: enemy.y, w: enemy.w, h: enemy.h };
        if (rectsIntersect(hitbox, eRect)) {
          enemy.hp -= damage;
          if (enemy.hp <= 0) {
            enemy.alive = false;
            player.score += 100;
          } else {
            player.score += 20;
          }
        }
      }
    }

    function updatePlayer() {
      player.attackCooldown = Math.max(0, player.attackCooldown - 0.016);

      player.vy += 0.55;
      player.x += player.vx;
      resolveHorizontalCollision();
      player.y += player.vy;
      resolveVerticalCollisions();

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > level.width) player.x = level.width - player.w;

      if (player.y > canvas.height + 200) {
        player.health -= 20;
        if (player.health <= 0) {
          gameOver = true;
        } else {
          player.x = level.spawn.x;
          player.y = level.spawn.y;
        }
      }

      camera.x = Math.max(0, Math.min(player.x - canvas.width * 0.35, level.width - canvas.width));

      if (player.invuln > 0) player.invuln -= 1;
    }

    function resolveHorizontalCollision() {
      for (const p of level.platforms) {
        const playerRect = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (rectsIntersect(playerRect, p)) {
          if (player.vx > 0) player.x = p.x - player.w;
          else if (player.vx < 0) player.x = p.x + p.w;
          player.vx = 0;
        }
      }
    }

    function resolveVerticalCollisions() {
      player.onGround = false;
      for (const p of level.platforms) {
        const playerRect = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (rectsIntersect(playerRect, p)) {
          const prevBottom = player.y - player.vy + player.h;
          if (player.vy >= 0 && prevBottom <= p.y + 20) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
            player.canDoubleJump = true;
          } else if (player.vy < 0 && player.y - player.vy >= p.y + p.h - 14) {
            player.y = p.y + p.h;
            player.vy = 0;
          }
        }
      }
    }

    function updateEnemies() {
      for (const enemy of level.enemies) {
        if (!enemy.alive) continue;

        enemy.x += enemy.dir * 1.35;

        if (enemy.x <= enemy.minX || enemy.x + enemy.w >= enemy.maxX) {
          enemy.dir *= -1;
          enemy.x = Math.max(enemy.minX, Math.min(enemy.x, enemy.maxX - enemy.w));
        }

        const collisionRect = { x: player.x, y: player.y, w: player.w, h: player.h };
        const enemyRect = { x: enemy.x, y: enemy.y, w: enemy.w, h: enemy.h };
        if (rectsIntersect(collisionRect, enemyRect)) {
          const playerBottom = player.y + player.h;
          const enemyTop = enemy.y;
          const stomp = player.vy > 0 && playerBottom - enemyTop < 22;
          if (stomp) {
            player.vy = -9;
            enemy.alive = false;
            player.score += 80;
          } else {
            if (player.invuln <= 0) {
              player.health -= 12;
              player.invuln = 60;
              if (player.health <= 0) {
                gameOver = true;
              }
            }
          }
        }
      }
    }

    function updateCoins() {
      for (const coin of level.coins) {
        if (coin.collected) continue;
        const c = { x: coin.x, y: coin.y, r: coin.r };
        const p = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (circleRectCollision(c, p)) {
          coin.collected = true;
          player.score += 25;
        }
      }
    }

    function checkGoal() {
      if (level.enemies.every(e => !e.alive) && level.coins.every(c => c.collected)) {
        const goalX = level.goalX;
        const playerFront = player.x + player.w;
        if (playerFront >= goalX) {
          levelComplete = true;
          if (currentLevelIndex < levels.length - 1) {
            player.score += 300;
            setTimeout(() => {
              if (gameStarted) {
                currentLevelIndex += 1;
                loadLevel(currentLevelIndex);
              }
            }, 2000);
          } else {
            gameWon = true;
          }
        }
      }
    }

    function update() {
      if (!gameStarted || gameOver || gameWon || levelComplete) return;

      handleInput();
      updatePlayer();
      updateEnemies();
      updateCoins();
      checkGoal();
      updateHud();
    }

    function drawBackground() {
      ctx.fillStyle = '#7dd3fc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const offset = camera.x * 0.3;
      drawCloud(120 - offset % 500, 110, 1.2);
      drawCloud(520 - offset % 500, 80, 1.0);
      drawCloud(850 - offset % 500, 150, 1.5);

      ctx.fillStyle = '#86efac';
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      ctx.lineTo(0, 430);
      ctx.quadraticCurveTo(190, 300, 380, 430);
      ctx.quadraticCurveTo(560, 260, 760, 430);
      ctx.quadraticCurveTo(930, 250, 1100, 430);
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#a7f3d0';
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      ctx.lineTo(0, 360);
      ctx.lineTo(130, 210);
      ctx.lineTo(300, 360);
      ctx.lineTo(430, 180);
      ctx.lineTo(590, 360);
      ctx.lineTo(760, 160);
      ctx.lineTo(930, 360);
      ctx.lineTo(canvas.width, 360);
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();
      ctx.fill();
    }

    function drawCloud(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(0, 0, 30, 0, Math.PI * 2);
      ctx.arc(35, -10, 26, 0, Math.PI * 2);
      ctx.arc(70, 0, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPlatform(p) {
      ctx.fillStyle = '#4b5563';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#6b7280';
      ctx.fillRect(p.x, p.y, p.w, 6);
    }

    function drawCoin(coin) {
      if (coin.collected) return;
      ctx.save();
      ctx.translate(coin.x, coin.y);
      ctx.rotate(Date.now() * 0.01);
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, coin.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    function drawEnemy(enemy) {
      if (!enemy.alive) return;
      ctx.save();
      ctx.translate(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2);

      ctx.strokeStyle = '#65a30d';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, -15, 8, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -7);
      ctx.lineTo(0, 18);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-10, 13);
      ctx.moveTo(0, 0);
      ctx.lineTo(10, 13);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 18);
      ctx.lineTo(-10, 32);
      ctx.moveTo(0, 18);
      ctx.lineTo(10, 32);
      ctx.stroke();

      ctx.fillStyle = '#111827';
      ctx.fillRect(-4, -18, 2, 2);
      ctx.fillRect(2, -18, 2, 2);

      ctx.restore();
    }

    function drawPlayer() {
      const blink = player.invuln > 0 && Math.floor(player.invuln / 8) % 2 === 0;
      if (blink) return;

      ctx.save();
      ctx.translate(player.x + player.w / 2, player.y + player.h / 2);

      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.arc(0, -22, 11, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -11);
      ctx.lineTo(0, 18);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.lineTo(-12, 10);
      ctx.moveTo(0, -4);
      ctx.lineTo(12, 10);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 18);
      ctx.lineTo(-10, 38);
      ctx.moveTo(0, 18);
      ctx.lineTo(10, 38);
      ctx.stroke();

      ctx.strokeStyle = player.weapon.color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      if (player.facing > 0) {
        ctx.moveTo(14, -2);
        ctx.lineTo(32, -1);
        ctx.lineTo(38, 8);
      } else {
        ctx.moveTo(-14, -2);
        ctx.lineTo(-32, -1);
        ctx.lineTo(-38, 8);
      }
      ctx.stroke();

      ctx.restore();
    }

    function drawGoal(levelDef) {
      const goalX = levelDef.goalX;
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(goalX - 6, 120, 12, 410);
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(goalX + 6, 120);
      ctx.lineTo(goalX + 90, 170);
      ctx.lineTo(goalX + 6, 220);
      ctx.closePath();
      ctx.fill();
    }

    function render() {
      drawBackground();

      ctx.save();
      ctx.translate(-camera.x, 0);
      for (const p of level.platforms) drawPlatform(p);
      for (const coin of level.coins) drawCoin(coin);
      for (const enemy of level.enemies) drawEnemy(enemy);
      drawGoal(level);
      drawPlayer();
      ctx.restore();

      if (gameOver) {
        ctx.fillStyle = 'rgba(17, 24, 39, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '22px Arial';
        ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 40);
      }

      if (levelComplete && !gameWon) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('LEVEL COMPLETE!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '22px Arial';
        ctx.fillText('Next level loading...', canvas.width / 2, canvas.height / 2 + 40);
      }

      if (gameWon) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 52px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🎉 YOU WON! 🎉', canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillStyle = '#fff';
        ctx.font = '24px Arial';
        ctx.fillText('Final Score: ' + player.score, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText('All 3 levels completed! Press R to restart', canvas.width / 2, canvas.height / 2 + 60);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (e) => {
      const code = e.code;

      if (code === 'ArrowLeft' || code === 'KeyA') keys.left = true;
      if (code === 'ArrowRight' || code === 'KeyD') keys.right = true;
      if (code === 'ArrowUp' || code === 'KeyW' || code === 'Space') keys.jump = true;
      if (code === 'KeyJ' || code === 'KeyK') keys.attack = true;
      if (code === 'KeyQ') prevWeapon();
      if (code === 'KeyE') nextWeapon();
      if (code === 'KeyI') toggleInventory();

      if (code === 'KeyR') {
        player.score = 0;
        gameOver = false;
        gameWon = false;
        levelComplete = false;
        loadLevel(0);
      }
    });

    document.addEventListener('keyup', (e) => {
      const code = e.code;
      if (code === 'ArrowLeft' || code === 'KeyA') keys.left = false;
      if (code === 'ArrowRight' || code === 'KeyD') keys.right = false;
      if (code === 'ArrowUp' || code === 'KeyW' || code === 'Space') keys.jump = false;
      if (code === 'KeyJ' || code === 'KeyK') keys.attack = false;
    });

    player.weapon = weaponCatalog[0];
    loadLevel(0);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
